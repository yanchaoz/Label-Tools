[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "label-tools"
version = "0.1.0"
description = "Local-first 2D instance annotation and reviewed training-pair export"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Yanchao Zhang"}]
dependencies = [
  "numpy>=1.23,<3",
  "Pillow>=10,<13",
  "tifffile>=2023.7.10",
  "shapely>=2,<3",
  "filelock>=3.13,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "ruff>=0.9,<1"]
centers = ["scipy>=1.10,<2", "scikit-image>=0.22,<1"]

[project.scripts]
label-tools = "label_tools.cli:main"

[project.urls]
Repository = "https://github.com/yanchaoz/Label-Tools"
Issues = "https://github.com/yanchaoz/Label-Tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
label_tools = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*"]
"label_tools.centers" = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
