<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Center Instance | Center-point instance annotation</title><link rel="stylesheet" href="/style.css"><script defer src="/lucide.min.js"></script><script defer src="/merge.js"></script><script defer src="/app.js"></script></head>
<body>
<header><div class="brand"><i data-lucide="scan-eye"></i><strong>Center Instance</strong><span id="pixel-size">px</span></div><select id="target" aria-label="Target"></select><span id="save-state">Loading</span><button id="save" class="icon" title="Save annotations"><i data-lucide="save"></i></button><button id="export" class="primary"><i data-lucide="download"></i>Export training data</button></header>
<main>
<aside class="browser"><div class="section-head"><strong>Images</strong><span id="progress"></span></div><input id="search" type="search" placeholder="Search images" aria-label="Search images"><select id="group" aria-label="Group"><option value="all">All groups</option></select><div id="case-list"></div></aside>
<section class="workspace">
<div class="canvas-head"><div class="navigation"><button id="prev" class="icon" title="Previous image"><i data-lucide="chevron-left"></i></button><strong id="case-title">Image</strong><button id="next" class="icon" title="Next image"><i data-lucide="chevron-right"></i></button><span id="case-group"></span></div><div class="zoom"><button id="zoom-out" class="icon" title="Zoom out"><i data-lucide="minus"></i></button><span id="zoom-level">100%</span><button id="zoom-in" class="icon" title="Zoom in"><i data-lucide="plus"></i></button><button id="fit" class="icon" title="Fit image"><i data-lucide="maximize"></i></button></div></div>
<div id="viewport"><canvas id="canvas" aria-label="Instance annotation canvas"></canvas><div class="tools" role="toolbar" aria-label="Annotation tools"><button data-mode="point" class="icon active" title="Centers: click to add, drag to move"><i data-lucide="crosshair"></i></button><button data-mode="merge" class="icon" title="Merge points: select instances, then confirm"><i data-lucide="merge"></i></button><button data-mode="pan" class="icon" title="Pan; or hold Space and drag"><i data-lucide="hand"></i></button><button data-mode="add" class="icon" title="Add foreground"><i data-lucide="paintbrush"></i></button><button data-mode="erase" class="icon" title="Erase foreground"><i data-lucide="eraser"></i></button><hr><button id="delete" class="icon" title="Delete selected center"><i data-lucide="trash-2"></i></button><button id="undo" class="icon" title="Undo Ctrl+Z"><i data-lucide="undo-2"></i></button><button id="redo" class="icon" title="Redo Ctrl+Shift+Z"><i data-lucide="redo-2"></i></button></div><div id="merge-actions" hidden><span id="merge-pending-count">0</span><button id="merge-apply" class="icon" title="Confirm merge (Enter)" disabled><i data-lucide="check"></i></button><button id="merge-cancel" class="icon" title="Cancel merge points (Escape)" disabled><i data-lucide="x"></i></button></div><span id="busy" hidden>Computing</span><div class="scale-bar"><span id="scale-line"></span><span id="scale-label"></span></div></div>
<footer><span id="coordinates">X — · Y —</span><span id="dimensions">Image dimensions</span><span id="counts"></span></footer>
</section>
<aside class="inspector"><div class="section-head"><strong>Layers and annotation</strong><span id="revision">r0</span></div><div class="control-block"><div class="segments" role="group" aria-label="Display layer"><button data-layer="instances" class="active">Instances</button><button data-layer="boundary">Boundary</button><button data-layer="raw">Raw</button></div><label>Overlay opacity <output id="opacity-value">50%</output><input id="opacity" type="range" min="0" max="100" value="50"></label><label class="check"><input id="show-points" type="checkbox" checked>Center IDs</label></div>
<div class="control-block"><label>Brush radius <output id="brush-value">8 px</output><input id="brush" type="range" min="1" max="60" value="8"></label><label>Boundary width <select id="boundary-width"><option value="1">1 px</option><option value="2" selected>2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="6">6 px</option><option value="8">8 px</option></select></label><label>Image gradient weight <output id="weight-value">0.15</output><input id="image-weight" type="range" min="0" max="100" value="15"></label></div>
<div class="point-head"><strong>Merge groups</strong><span id="merge-count">0</span></div><div id="merge-list"></div><div class="point-head"><strong>Centers</strong><span id="point-count">0</span></div><div id="point-list"></div><div class="review-block"><label class="check"><input id="reviewed" type="checkbox">Foreground and instances fully reviewed</label><textarea id="notes" rows="2" placeholder="Review notes" aria-label="Review notes"></textarea></div><div id="notice" role="status" hidden></div></aside>
</main>
<dialog id="export-dialog"><form method="dialog"><div class="dialog-head"><strong>Export training data</strong><button class="icon" title="Close"><i data-lucide="x"></i></button></div></form><label>Export scope<select id="export-scope"><option value="current">Current image and target</option><option value="saved">All saved annotations</option><option value="all">All images for current target</option></select></label><div id="export-status"></div><button id="start-export" class="primary"><i data-lucide="folder-output"></i>Generate training data</button></dialog>
</body></html>
