name: Tests and package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev,centers]"
      - run: python -m pytest
      - run: python -m ruff check src tests
      - run: python -m build
      - run: node --check src/label_tools/web/app.js
      - run: node --check src/label_tools/web/i18n.js
      - run: node --check src/label_tools/centers/web/app.js
      - run: python -m label_tools --version
